name: Engine tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: danmo-make
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: danmo-make
          submodules: true

      - name: Install native build deps
        # MLX's Linux CPU backend links BLAS and LAPACKE.
        run: sudo apt-get update && sudo apt-get install -y g++ cmake libopenblas-dev liblapacke-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test ggml backend
        # Workspace members include danmo-mlx / danmo-mlx-sys; this job is the
        # non-MLX (ggml) gate. Exclude them so CI does not compile or SIGSEGV
        # the MLX CPU backend without metal/cuda features.
        run: >
          cargo test --manifest-path native/Cargo.toml --workspace
          --exclude danmo-mlx --exclude danmo-mlx-sys
