name: Engine tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: danmo-make
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: danmo-make
          submodules: true

      - name: Install libstdc++
        run: sudo apt-get update && sudo apt-get install -y g++ cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test ggml backend
        run: cargo test --manifest-path native/Cargo.toml
