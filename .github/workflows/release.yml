# macOS MLX desktop + Linux MLX (mlx[cuda]) thin server tar.gz.
# Linux desktop (AppImage/deb) temporarily omitted from CI (local: make pack-linux-desktop).
# Windows temporarily unsupported. Linux thin pack omits mlx wheels; first run installs via bootstrap.
name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (e.g. 0.2.0). Used for desktop semver and Linux archive names.
        required: false
        type: string

# Required to attach release assets (not only Actions artifacts).
permissions:
  contents: write

jobs:
  build-desktop:
    name: macOS desktop (MLX)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: danmo-make

      - name: Checkout dq-ui
        uses: actions/checkout@v6
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install and build dq-ui
        run: |
          npm install
          npm run build
        working-directory: ${{ github.workspace }}/dq-ui

      - name: Setup Rust
        run: rustup target add aarch64-apple-darwin

      - name: Create venv and install dependencies
        working-directory: danmo-make
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-macos.txt
          pip install pyinstaller

      - name: Set release version
        working-directory: danmo-make
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Set desktop version from tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: danmo-make
        run: python3 scripts/set_desktop_version.py "${GITHUB_REF_NAME#v}"

      - name: Set desktop version (manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        working-directory: danmo-make
        run: python3 scripts/set_desktop_version.py "${{ inputs.version }}"

      - name: Build desktop bundle (MLX sidecar)
        working-directory: danmo-make
        env:
          DANQING_PYINSTALLER_PROFILE: mlx
        run: |
          source .venv/bin/activate
          make pack-macos-desktop

      - name: Verify DMG was produced
        working-directory: danmo-make
        run: |
          ls -la out/desktop/bundle/
          ls -la out/desktop/bundle/dmg/
          test -n "$(find out/desktop/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: danqing-desktop-macos
          path: |
            danmo-make/out/desktop/bundle/dmg/*.dmg
            danmo-make/out/desktop/bundle/macos/*.app
          if-no-files-found: error

  build-linux-mlx:
    name: Linux MLX server (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: danmo-make

      - name: Checkout dq-ui
        uses: actions/checkout@v6
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install and build dq-ui
        run: |
          npm install
          npm run build
        working-directory: ${{ github.workspace }}/dq-ui

      - name: Set release version
        working-directory: danmo-make
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Create build venv
        working-directory: danmo-make
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip

      - name: Build Linux MLX thin tar.gz
        working-directory: danmo-make
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          source .venv/bin/activate
          make pack-linux-server-archive RELEASE_VERSION="$RELEASE_VERSION"

      - name: Verify tar.gz was produced
        working-directory: danmo-make
        run: |
          ls -la out/dist/
          test -f "out/dist/danmo-make-linux-mlx-x86_64-${RELEASE_VERSION}.tar.gz"

      - name: Upload Linux MLX artifact
        uses: actions/upload-artifact@v6
        with:
          name: danqing-linux-mlx
          path: danmo-make/out/dist/danmo-make-linux-mlx-x86_64-*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-desktop, build-linux-mlx]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v6
        with:
          name: danqing-desktop-macos
          path: release-assets/macos

      - name: Download Linux MLX server artifact
        uses: actions/download-artifact@v6
        with:
          name: danqing-linux-mlx
          path: release-assets/linux-server

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/**/*.dmg
            release-assets/linux-server/**/*.tar.gz
          fail_on_unmatched_files: true
