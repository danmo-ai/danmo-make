# ggml desktop and headless server. The sidecar is the Rust danqing-api binary.
name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (e.g. 0.2.0).
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-desktop:
    name: macOS desktop (ggml Metal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: danmo-make
          submodules: true

      - name: Checkout dq-ui
        uses: actions/checkout@v6
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install and build dq-ui
        run: |
          npm install
          npm run build
        working-directory: ${{ github.workspace }}/dq-ui

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set release version
        working-directory: danmo-make
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "DANQING_DESKTOP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "DANQING_DESKTOP_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Build desktop bundle
        working-directory: danmo-make
        run: make pack-macos-desktop

      - name: Verify DMG was produced
        working-directory: danmo-make
        run: |
          ls -la out/desktop/bundle/ || true
          test -n "$(find out/desktop/bundle -name '*.dmg' -print -quit)"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: danmo-make-desktop-macos
          path: danmo-make/out/desktop/bundle/**/*.dmg
          if-no-files-found: error

  build-linux-server:
    name: Linux ggml server (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: danmo-make
          submodules: true

      - name: Checkout dq-ui
        uses: actions/checkout@v6
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Install libstdc++
        run: sudo apt-get update && sudo apt-get install -y g++ cmake

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install and build dq-ui
        run: |
          npm install
          npm run build
        working-directory: ${{ github.workspace }}/dq-ui

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set release version
        working-directory: danmo-make
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"
          fi

      - name: Build Linux ggml archive
        working-directory: danmo-make
        run: make pack-linux-server RELEASE_VERSION="$RELEASE_VERSION"

      - name: Verify tar.gz was produced
        working-directory: danmo-make
        run: |
          ls -la out/dist/
          test -n "$(find out/dist -name 'danmo-make-linux-ggml-*.tar.gz' -print -quit)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: danmo-make-linux-ggml
          path: danmo-make/out/dist/danmo-make-linux-ggml-*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-desktop, build-linux-server]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v6
        with:
          name: danmo-make-desktop-macos
          path: release-assets/macos

      - name: Download Linux server artifact
        uses: actions/download-artifact@v6
        with:
          name: danmo-make-linux-ggml
          path: release-assets/linux-server

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/**/*.dmg
            release-assets/linux-server/**/*.tar.gz
          fail_on_unmatched_files: true
