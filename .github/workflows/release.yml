# Build Danmo Make release artifacts:
#   - macOS desktop (.dmg) — danqing-api --features metal,mlx-metal
#   - Linux desktop (AppImage + .deb) — danqing-api --features mlx-cuda (toolkit + cuDNN; no GPU)
#   - Linux server (.tar.gz) — same mlx-cuda sidecar + frontend
#
# MLX/mlx-c: git submodules; compiled by danmo-mlx-sys. Linux installs CUDA 12.9 + cuDNN via
# Linux jobs: nvidia/cuda 12.9 cudnn-devel image (skip apt CUDA install) +
# scripts/ci_install_cuda_ubuntu.sh (compile-only; physical GPU not required).
#
# Trigger: v* tags, or workflow_dispatch.
name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version label (e.g. 0.2.0).
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-desktop:
    name: macOS desktop (Metal + MLX)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: danmo-make
          submodules: recursive
          fetch-depth: 0

      - name: Checkout dq-ui
        uses: actions/checkout@v4
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Select Xcode + build tools
        run: |
          # MLX Metal needs the full Xcode metal compiler (not only CLT).
          if [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun -sdk macosx metal -v
          brew install cmake ninja
          command -v cmake
          cmake --version

      - name: Verify mlx / mlx-c submodules
        working-directory: danmo-make
        run: |
          test -f native/third_party/mlx/CMakeLists.txt
          test -f native/third_party/mlx-c/CMakeLists.txt
          test -f native/third_party/ggml/CMakeLists.txt
          test -f native/third_party/fmt/CMakeLists.txt
          test -f native/third_party/json/CMakeLists.txt
          echo "vendored MLX/ggml sources OK"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build dq-ui
        working-directory: ${{ github.workspace }}/dq-ui
        run: |
          npm install
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            danmo-make/native -> target
            danmo-make/desktop/src-tauri -> target
          shared-key: macos-desktop-mlx

      - name: Set release version
        working-directory: danmo-make
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          else
            ver="$(git describe --tags --always --dirty)"
          fi
          echo "RELEASE_VERSION=${ver}" >> "$GITHUB_ENV"
          echo "DANQING_DESKTOP_VERSION=${ver}" >> "$GITHUB_ENV"
          echo "version=${ver}"

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x danmo-make/scripts/ci_import_apple_cert.sh
          danmo-make/scripts/ci_import_apple_cert.sh

      - name: Build macOS desktop
        working-directory: danmo-make
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          DANQING_DESKTOP_VERSION: ${{ env.DANQING_DESKTOP_VERSION }}
          # Fail loud if Metal toolchain is missing mid-build.
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: make pack-macos-desktop

      - name: Verify DMG
        working-directory: danmo-make
        run: |
          ls -laR out/desktop/bundle || true
          test -n "$(find out/desktop/bundle -name '*.dmg' -print -quit)"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: danmo-make-desktop-macos
          path: danmo-make/out/desktop/bundle/**/*.dmg
          if-no-files-found: error

  build-linux-desktop:
    name: Linux desktop (mlx-cuda)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    container:
      image: nvidia/cuda:12.9.1-cudnn-devel-ubuntu22.04
      options: --privileged
    env:
      DANQING_CUDA_SKIP_APT_INSTALL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: danmo-make
          submodules: recursive
          fetch-depth: 0

      - name: Checkout dq-ui
        uses: actions/checkout@v4
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Extra swap (MLX CUDA link memory)
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            g++ \
            pkg-config \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            file \
            wget \
            curl \
            git \
            libfuse2

      - name: Configure CUDA env (preinstalled toolkit)
        working-directory: danmo-make
        run: bash scripts/ci_install_cuda_ubuntu.sh

      - name: Verify mlx / mlx-c / ggml + nvcc
        working-directory: danmo-make
        run: |
          test -f native/third_party/mlx/CMakeLists.txt
          test -f native/third_party/mlx-c/CMakeLists.txt
          test -f native/third_party/ggml/CMakeLists.txt
          command -v nvcc
          nvcc --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build dq-ui
        working-directory: ${{ github.workspace }}/dq-ui
        run: |
          npm install
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            danmo-make/native -> target
            danmo-make/desktop/src-tauri -> target
          shared-key: linux-desktop-mlx-cuda

      - name: Set release version
        working-directory: danmo-make
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          else
            ver="$(git describe --tags --always --dirty)"
          fi
          echo "RELEASE_VERSION=${ver}" >> "$GITHUB_ENV"
          echo "DANQING_DESKTOP_VERSION=${ver}" >> "$GITHUB_ENV"
          echo "version=${ver}"

      - name: Build Linux desktop (mlx-cuda)
        working-directory: danmo-make
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          DANQING_DESKTOP_VERSION: ${{ env.DANQING_DESKTOP_VERSION }}
          DANQING_SIDECAR_FEATURES: mlx-cuda
          CI: true
        run: make pack-linux-desktop

      - name: Verify AppImage / deb
        working-directory: danmo-make
        run: |
          ls -laR out/desktop/bundle || true
          test -n "$(find out/desktop/bundle -name '*.AppImage' -print -quit)"
          test -n "$(find out/desktop/bundle -name '*.deb' -print -quit)"

      - name: Upload Linux desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: danmo-make-desktop-linux-mlx-cuda
          path: |
            danmo-make/out/desktop/bundle/**/*.AppImage
            danmo-make/out/desktop/bundle/**/*.deb
          if-no-files-found: error

  build-linux-server:
    name: Linux server (mlx-cuda tar.gz)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    container:
      image: nvidia/cuda:12.9.1-cudnn-devel-ubuntu22.04
      options: --privileged
    env:
      DANQING_CUDA_SKIP_APT_INSTALL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: danmo-make
          submodules: recursive
          fetch-depth: 0

      - name: Checkout dq-ui
        uses: actions/checkout@v4
        with:
          repository: danmo-ai/dq-ui
          path: dq-ui

      - name: Extra swap (MLX CUDA link memory)
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build g++ pkg-config libclang-dev wget git

      - name: Configure CUDA env (preinstalled toolkit)
        working-directory: danmo-make
        run: bash scripts/ci_install_cuda_ubuntu.sh

      - name: Verify mlx / mlx-c + nvcc
        working-directory: danmo-make
        run: |
          test -f native/third_party/mlx/CMakeLists.txt
          test -f native/third_party/mlx-c/CMakeLists.txt
          command -v nvcc
          nvcc --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build dq-ui
        working-directory: ${{ github.workspace }}/dq-ui
        run: |
          npm install
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: danmo-make/native -> target
          shared-key: linux-server-mlx-cuda

      - name: Set release version
        working-directory: danmo-make
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          else
            ver="$(git describe --tags --always --dirty)"
          fi
          echo "RELEASE_VERSION=${ver}" >> "$GITHUB_ENV"
          echo "version=${ver}"

      - name: Build Linux server archive (mlx-cuda)
        working-directory: danmo-make
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          DANQING_SIDECAR_FEATURES: mlx-cuda
          DANQING_SERVER_BACKEND_TAG: mlx-cuda
        run: make pack-linux-server RELEASE_VERSION="$RELEASE_VERSION"

      - name: Verify tar.gz
        working-directory: danmo-make
        run: |
          ls -la out/dist/
          test -n "$(find out/dist -name 'danmo-make-linux-mlx-cuda-*.tar.gz' -print -quit)"

      - name: Upload Linux server artifact
        uses: actions/upload-artifact@v4
        with:
          name: danmo-make-linux-mlx-cuda
          path: danmo-make/out/dist/danmo-make-linux-mlx-cuda-*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos-desktop, build-linux-desktop, build-linux-server]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS desktop
        uses: actions/download-artifact@v4
        with:
          name: danmo-make-desktop-macos
          path: release-assets/macos

      - name: Download Linux desktop
        uses: actions/download-artifact@v4
        with:
          name: danmo-make-desktop-linux-mlx-cuda
          path: release-assets/linux-desktop

      - name: Download Linux server
        uses: actions/download-artifact@v4
        with:
          name: danmo-make-linux-mlx-cuda
          path: release-assets/linux-server

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/**/*.dmg
            release-assets/linux-desktop/**/*.AppImage
            release-assets/linux-desktop/**/*.deb
            release-assets/linux-server/**/*.tar.gz
          fail_on_unmatched_files: true
