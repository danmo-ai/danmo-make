[package]
name = "danmo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "danqing-api"
path = "src/main.rs"

[features]
default = []
cuda = ["danmo-engine/cuda"]
vulkan = ["danmo-engine/vulkan"]
metal = ["danmo-engine/metal"]

[dependencies]
danmo-engine = { path = "../danmo-engine" }
danmo-contracts = { path = "../danmo-contracts" }
danmo-catalog = { path = "../danmo-catalog" }
danmo-schedule = { path = "../danmo-schedule" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
