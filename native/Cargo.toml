[workspace]
resolver = "2"
members = [
    "crates/danmo-ggml-sys",
    "crates/danmo-contracts",
    "crates/danmo-catalog",
    "crates/danmo-store",
    "crates/danmo-schedule",
    "crates/danmo-engine",
    "crates/danmo-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
